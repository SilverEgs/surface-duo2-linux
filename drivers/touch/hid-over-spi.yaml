%YAML 1.2
---
$id: http://devicetree.org/schemas/input/hid-over-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HID over SPI Devices (MIPI HIDSPI protocol)

maintainers:
  - Benjamin Tissoires <benjamin.tissoires@redhat.com>
  - Jiri Kosina <jkosina@suse.cz>

description: |+
  The HID over SPI protocol — also known as the MIPI HIDSPI specification
  — provides support for Human Interface Devices (touchscreens, touchpads,
  etc.) connected over a standard SPI bus.  The kernel driver
  (hid-over-spi.c) implements the transport layer; the generic HID core
  parses the HID report descriptor and maps reports to input events.

  The protocol is defined by the MIPI Alliance.  Kernel‑side protocol
  constants live in include/linux/hid-over-spi.h.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: hid-over-spi

  reg:
    maxItems: 1
    description: SPI chip select index

  interrupts:
    maxItems: 1
    description: |
      Device interrupt line (typically a level‑triggered GPIO wired to
      the touch controller's IRQ output).  The device asserts this line
      when it has an input report ready (touch data, reset acknowledgement,
      or a command/descriptor response).

  spi-max-frequency:
    description: Maximum SPI clock frequency in Hz

  hid-descr-addr:
    description: |
      HID descriptor address — the SPI register offset at which the
      device's HIDSPI device descriptor can be read (or to which the
      DEVICE_DESCRIPTOR output command is directed).  The default is 1,
      matching the convention used by the MIPI HIDSPI specification.
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 1

  reset-gpios:
    description: |
      Optional GPIO connected to the device's reset pin.  When provided,
      the driver toggles this GPIO at probe time to ensure the device
      starts from a known state and then waits for the HIDSPI
      RESET_RESPONSE input report.
    maxItems: 1

  wakeup-source:
    description: |
      Indicates that the device can wake the system from suspend.
    type: boolean

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        /* Microsoft Surface Duo 2 "d6" touch controller on SM8350 */
        touchscreen@0 {
            compatible = "hid-over-spi";
            reg = <0>;
            spi-max-frequency = <32000000>;
            interrupts = <84 IRQ_TYPE_EDGE_FALLING>;
            hid-descr-addr = <1>;
            reset-gpios = <&tlmm 85 GPIO_ACTIVE_LOW>;
        };
    };
...